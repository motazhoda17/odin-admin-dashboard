<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="icons/view-dashboard.svg" alt="">
      <span>Dashboard</span>
    </div>

    <nav>
      <ul class="nav-list">
        <li><a href="#"><img src="icons/home.svg" alt="">Home</a></li>
        <li><a href="#"><img src="icons/card-account-details.svg" alt="">Profile</a></li>
        <li><a href="#"><img src="icons/message.svg" alt="">Messages</a></li>
        <li><a href="#"><img src="icons/history.svg" alt="">History</a></li>
        <li><a href="#"><img src="icons/file-document-multiple.svg" alt="">Tasks</a></li>
        <li><a href="#"><img src="icons/account-group.svg" alt="">Communities</a></li>
      </ul>

      <ul class="nav-list">
        <li><a href="#"><img src="icons/cog.svg" alt="">Settings</a></li>
        <li><a href="#"><img src="icons/help-box.svg" alt="">Support</a></li>
        <li><a href="#"><img src="icons/shield-check.svg" alt="">Privacy</a></li>
      </ul>
    </nav>
  </aside>

  <header class="header">
    <div class="header-top">
      <div class="search">
        <img src="icons/magnify.svg" alt="">
        <input type="search" aria-label="Search">
      </div>

      <div class="user-info">
        <img src="icons/bell-ring-outline.svg" alt="Notifications" class="icon">
        <div class="avatar avatar-small" style="--color: #f6c445">MO</div>
        <span class="user-name">Morgan Oakley</span>
      </div>
    </div>

    <div class="header-bottom">
      <div class="greeting">
        <div class="avatar avatar-large" style="--color: #f6c445">MO</div>
        <div>
          <p class="hi">Hi there,</p>
          <p class="name">Morgan Oakley (@morgan)</p>
        </div>
      </div>

      <div class="header-buttons">
        <button>New</button>
        <button>Upload</button>
        <button>Share</button>
      </div>
    </div>
  </header>

  <main class="main">
    Main content
  </main>
</body>
</html>
